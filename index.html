<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Tienda Tech</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .auth-container h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        .auth-container .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 2rem;
        }

        .auth-container .form-group {
            margin-bottom: 1.25rem;
        }

        .auth-container label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #0f172a;
            font-size: 0.875rem;
        }

        .auth-container input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            color: #0f172a;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .auth-container input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .auth-container .btn {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .auth-container .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.875rem;
        }

        .auth-container .error-message.show {
            display: block;
        }

        .auth-container .success-message {
            background: #dcfce7;
            color: #166534;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.875rem;
        }

        .auth-container .success-message.show {
            display: block;
        }

        .auth-container .auth-links {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 0.875rem;
        }

        .auth-container .auth-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-container .auth-links a:hover {
            text-decoration: underline;
        }

        .auth-container .info-box {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #475569;
        }

        .auth-container .info-box strong {
            color: #0f172a;
        }

        .auth-container .info-box .demo-user {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
        }

        @media (max-width: 480px) {
            .auth-container {
                margin: 2rem 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <h1>🛒 Tienda Tech</h1>
            <p class="subtitle">Inicia sesión para continuar</p>

            <!-- Mensajes -->
            <div id="errorMessage" class="error-message">
                ❌ Usuario o contraseña incorrectos
            </div>
            <div id="successMessage" class="success-message">
                ✅ ¡Registro exitoso! Ahora inicia sesión
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">👤 Usuario</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">🔑 Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>

            <!-- Enlaces -->
            <div class="auth-links">
                ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
            </div>

            <!-- Demo Users -->
            <div class="info-box">
                <strong>🔐 Usuarios de Demo:</strong>
                <div class="demo-user">
                    <span>👑 Admin:</span>
                    <span><strong>admin</strong> / <strong>admin123</strong></span>
                </div>
                <div class="demo-user">
                    <span>👤 Usuario:</span>
                    <span><strong>usuario</strong> / <strong>user123</strong></span>
                </div>
                <div style="margin-top: 0.5rem; font-size: 0.75rem; color: #94a3b8;">
                    ⚡ También puedes registrarte como nuevo usuario
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
